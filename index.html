<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sheets Dashboard Demo</title><style>body{font-family:system-ui,sans-serif;background:#f5f6fa;color:#20263b;margin:0;padding:28px}.wrap{max-width:820px;margin:auto}.card{background:white;border-radius:18px;padding:24px;box-shadow:0 5px 20px #20263b12}h1{margin-top:0}input,button{padding:12px;border-radius:10px;border:1px solid #cbd2df;font:inherit}input{width:min(95%,560px)}button{background:#263b82;color:white;border:0;cursor:pointer;margin-top:10px}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{text-align:left;padding:12px;border-bottom:1px solid #e6e9f0}small{color:#667}</style></head><body><div class="wrap"><div class="card"><h1>📊 Sheets Dashboard</h1><p>ตัวอย่างการอ่านข้อมูลจากชีททดลอง (ยังไม่มีการเขียนข้อมูล)</p><label for="url">Apps Script Web App URL</label><p><input id="url" placeholder="https://script.google.com/macros/s/.../exec"></p><button id="load">โหลดข้อมูล</button><p id="status" role="status"></p><table><thead><tr><th>ชื่อ</th><th>ประเภท</th><th>ยอด</th></tr></thead><tbody id="rows"></tbody></table><small>ไม่ควรใช้กับข้อมูลส่วนตัวหรือยอดเงินจริงโดยเปิด API สาธารณะ</small></div></div><script>document.getElementById('load').onclick=async()=>{const status=document.getElementById('status'),url=document.getElementById('url').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\//.test(url)){status.textContent='กรุณาใส่ URL ของ Web App';return;}status.textContent='กำลังโหลด...';try{const response=await fetch(url);if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();const body=document.getElementById('rows');body.replaceChildren();for(const item of data.rows||[]){const tr=document.createElement('tr');for(const value of [item.name,item.type,item.amount]){const td=document.createElement('td');td.textContent=value;tr.append(td);}body.append(tr);}status.textContent='โหลดสำเร็จ '+(data.rows||[]).length+' รายการ';}catch(e){status.textContent='โหลดไม่สำเร็จ: '+e.message+' (อาจเป็นปัญหาสิทธิ์หรือ CORS)';}};</script></body></html>
